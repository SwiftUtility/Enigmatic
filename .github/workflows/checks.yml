name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
        configuration: [debug, release]
        include:
          - os: macos-26
            swift-version: 6.2.4
          - os: ubuntu-24.04
            container: swift:6.2.3
            swift-version: 6.2.3
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.3
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Verify Swift ${{ matrix.swift-version }}
        env:
          EXPECTED_SWIFT_VERSION: ${{ matrix.swift-version }}
        run: |
          swift --version
          swift --version | grep -F "Swift version $EXPECTED_SWIFT_VERSION "
      - name: Functional tests
        run: swift test -c ${{ matrix.configuration }} --skip PerformanceTests
      - name: Coverage gate tests
        if: matrix.os == 'macos-26' && matrix.configuration == 'debug'
        run: python3 -m unittest discover -s Scripts/tests
      - name: Coverage
        if: matrix.os == 'macos-26' && matrix.configuration == 'debug'
        run: |
          swift test --enable-code-coverage --skip PerformanceTests
          cp "$(swift test --show-codecov-path)" coverage.json
          python3 Scripts/check-coverage.py coverage.json --minimum 95
      - name: Upload coverage
        if: always() && matrix.os == 'macos-26' && matrix.configuration == 'debug' && hashFiles('coverage.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: error
      - name: Build documentation
        if: matrix.os == 'macos-26' && matrix.configuration == 'debug'
        run: |
          swift package dump-symbol-graph --minimum-access-level public
          enigmatic_symbols="$(dirname "$(swift build --show-bin-path)")/symbolgraph"
          mkdir -p .build/Enigmatic.symbolgraph
          cp "$enigmatic_symbols/Enigmatic.symbols.json" .build/Enigmatic.symbolgraph/
          for graph in "$enigmatic_symbols"/Enigmatic@*.symbols.json; do
            [ -f "$graph" ] || continue
            cp "$graph" .build/Enigmatic.symbolgraph/
          done
          xcrun docc convert Sources/Enigmatic/Enigmatic.docc \
            --additional-symbol-graph-dir .build/Enigmatic.symbolgraph \
            --output-path .build/Enigmatic.doccarchive \
            --transform-for-static-hosting \
            --hosting-base-path Enigmatic \
            --warnings-as-errors
      - name: Pack documentation
        if: matrix.os == 'macos-26' && matrix.configuration == 'debug'
        run: tar -czf Enigmatic.doccarchive.tar.gz -C .build Enigmatic.doccarchive
      - name: Upload documentation
        if: matrix.os == 'macos-26' && matrix.configuration == 'debug'
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: Enigmatic.doccarchive.tar.gz
          compression-level: 0
          if-no-files-found: error

  windows:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    name: windows-2022 / ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift 6.4.1
        uses: compnerd/gha-setup-swift@86d1ddeaf915c282137601aeb0654ea0e7b7f17e
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Verify Swift 6.4.1 for Windows x64
        run: |
          $version = (swift --version) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $version
          if ($version -notmatch 'Swift version 6\.4\.1(\s|$)') {
            throw 'Expected Swift 6.4.1'
          }
          if ($version -notmatch 'Target: x86_64-unknown-windows-msvc') {
            throw 'Expected the Windows x64 toolchain'
          }
      - name: Functional tests
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools not found' }
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          # Work around Swift 6.4.1's build-system and debug-type assertion issues.
          swift test -c ${{ matrix.configuration }} --build-system native -Xswiftc -Xfrontend -Xswiftc -disable-round-trip-debug-types --skip PerformanceTests
          exit $LASTEXITCODE
